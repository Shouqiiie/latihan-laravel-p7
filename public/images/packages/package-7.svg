<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <pattern id="pattern7" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#grad7)" />
  <rect width="640" height="400" fill="url(#pattern7)" />

  <!-- Moon and Star Symbol -->
  <g transform="translate(520, 60)" opacity="0.3">
    <path d="M25 0 A25 25 0 1 0 50 25 A30 30 0 0 1 25 0 Z" fill="#ffffff" />
    <polygon points="52,10 55,18 63,18 57,22 59,30 52,25 45,30 47,22 41,18 49,18" fill="#fbbf24" />
  </g>

  <!-- Mosque Silhouette -->
  <g fill="rgba(255,255,255,0.12)" transform="translate(0, 160)">
    <!-- Minaret Left -->
    <rect x="40" y="50" width="22" height="190" rx="3" />
    <polygon points="51,20 38,50 64,50" />
    <!-- Minaret Right -->
    <rect x="580" y="50" width="22" height="190" rx="3" />
    <polygon points="591,20 578,50 604,50" />
    <!-- Main Dome -->
    <path d="M 220 240 C 220 120 420 120 420 240 Z" />
    <!-- Side Domes -->
    <path d="M 120 240 C 120 160 230 160 230 240 Z" />
    <path d="M 410 240 C 410 160 520 160 520 240 Z" />
    <!-- Base -->
    <rect x="0" y="235" width="640" height="5" />
  </g>

  <!-- Glass Card Overlay -->
  <rect x="30" y="30" width="580" height="340" rx="16" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Top Badges -->
  <g transform="translate(50, 60)">
    <rect width="130" height="32" rx="6" fill="#f59e0b" />
    <text x="65" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">HEMAT PROMO</text>
    
    <rect x="140" width="90" height="32" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" />
    <text x="185" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">9 HARI</text>
  </g>

  <!-- Center Title -->
  <text x="50" y="165" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">Paket Sahabat Ummat Hemat</text>
  <text x="50" y="200" fill="rgba(255,255,255,0.85)" font-family="sans-serif" font-size="15">Fasilitas Hotel Bintang &amp; Bimbingan Ibadah Sesuai Sunnah</text>

  <!-- Footer Info in Card -->
  <line x1="50" y1="260" x2="590" y2="260" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  
  <text x="50" y="300" fill="#fde68a" font-family="sans-serif" font-size="13" font-weight="bold">RAHMAH TRAVEL &#8226; PT RAHMAH GROUP INTERNASIONAL</text>
  <text x="50" y="325" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="12">PPIU No. U.421 Kemenag RI &#8226; Pasti Berangkat, Pasti Berkah</text>
  
  <g transform="translate(480, 290)">
    <rect width="110" height="36" rx="8" fill="#10b981" />
    <text x="55" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RESMI TERPERCAYA</text>
  </g>
</svg>